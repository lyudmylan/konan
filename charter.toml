# Contract of this repo. The organization rules come from the source below.
# The checks: charter-check all charter.toml, and charter-gate quality --contract charter.toml
schema = 1

[repo]
name = "konan"

# The organization source. This repo holds no copy of it.
[source]
address = "https://github.com/lyudmylan/charter-org"
file = "organization.toml"
version = "v2"

# The version of Charter that this repo uses. The workflows fetch Charter at the tag charter--v<version>.
[charter]
version = "0.3.21"

[tools]
issue_tracker = "github-issues"
code_host = "github"
ci = "github-actions"

# Who holds a role in this repo.
[roles]
leader = ["lyudmylan"]
team_lead = ["lyudmylan"]
engineer = ["lyudmylan"]
agent = ["claude-code"]

# Risk tiers. The first tier whose paths match a file applies.
[tiers.high]
paths = ["charter.toml", "AGENTS.md", "intents/**", ".github/**", "hooks/**", ".claude/settings.json", "scripts/probe.sh", "scripts/receive.py"]  # the contract, the rules, the approved intents, the workflows, and the two scripts that a shift runs without a prompt
review = "deep"
approver = "leader"
approvals = 1

[tiers.low]
paths = ["**"]
review = "light"
approver = "engineer"
approvals = 1

# The review loop: a finding at this severity or above keeps the loop open. The limits come from the source.
[review]
threshold = "medium"
# The reviewer of the code is in its shadow period: its open findings block nothing yet.
code_blocks = false

# The Build phase: each work item has its plan, plans/<part>.md, before the code.
[build]
plan_before_code = true

[documents]
necessary = ["docs/product.md"]
code_paths = ["skills/**", "hooks/**", "scripts/**"]
text_checked = ["docs/product.md", "README.md"]   # they must contain none of the text-checked patterns
absent = ["docs/adr/**", "doc/adr/**", "doc/arch/adr-*.md", "docs/decisions/**"]   # no file for one decision: the choice and its reason go into the architecture map

# The boundary of a run of an agent without a person. Such a run never changes a file under no_write and
# never reads a file under no_read. The plan of a work item, plans/<part>.md, is under no pattern and passes.
# The first six patterns are those of the setup step. The others are of this repo: the boundary hook, which
# Claude Code starts outside the sandbox of a run; the two scripts that a shift runs without a prompt; the
# manifest of the plugin; the records of investigations; the fixtures of the eval; the ignore file, which
# decides what the commit of a run takes; the two legal files.
[boundary]
no_write = [
  "charter.toml", "AGENTS.md", "CLAUDE.md", "intents/**", ".github/**", ".claude/**",
  "hooks/**", "scripts/probe.sh", "scripts/receive.py", ".claude-plugin/**",
  "journals/**", "eval/runs/**", "eval/scenarios/**",
  ".gitignore", "LICENSE", "NOTICE",
]
no_read = [".env", ".env.*", "**/.env", "**/.env.*", "alerts/receiver-token"]

[instructions]
file = "AGENTS.md"

# Commands that must pass before a push. They run on the code of the change.
[checks]
# The first command reads its packages from the cache .uv-cache in the folder of the repo and never fetches.
# Fill the cache once: uv sync --script eval/tests.py --cache-dir .uv-cache
quality = ["uv run --offline --cache-dir .uv-cache eval/tests.py", "python3 hooks/tests.py", "python3 scripts/tests.py"]
# The product test: the commands that start the product and test it from the outside, or the reason for none.
no_product_reason = "konan is a set of skills that a Claude Code session runs against a live target, so each start of the product is a model call against a running lab; the parts that are code (the scorer, the boundary hook, the receiver) are tested by the three quality commands."

# The lifecycle map: the six phases of the AI-native SDLC playbook. In each: what does the work, which
# skill of Charter helps, and which built-in abilities of Claude Code the phase uses.
[lifecycle.plan]
work = "the leader with an agent: docs/product.md for the direction; the skill tracker for the issues and the intents"
builtin = ["plan mode"]

[lifecycle.design]
work = "the leader with an agent: the design spec of a work item, and docs/architecture.md kept current"
builtin = ["plan mode"]

[lifecycle.build]
work = "an agent on a branch, until the acceptance checks of the intent pass; the two checks before a push"
builtin = ["the Bash tool for the quality checks", "hooks"]

[lifecycle.test]
work = "the tests of the intent; the intent reviewer with the skill review-loop; a reviewer that is not the author"
builtin = ["/code-review", "/security-review", "claude plugin eval"]

[lifecycle.deploy]
work = "the verdict and the evidence record; the approver of the tier merges; a person decides production"
builtin = []

[lifecycle.maintain]
work = "a failure re-enters the cycle as an intent and ends as a check; each model upgrade runs the evals"
builtin = ["claude plugin eval"]
